# Local n8n for the portfolio.
#
# The version is pinned on purpose: 'latest' makes the repo stop being
# reproducible. 2.44.6 is what n8n marks as stable as of 2026-10-23.
#
# CAREFUL: n8n maintains several release lines in parallel (1.x, 2.x and v3
# nightly). Sorting Docker Hub tags by date is misleading: the most recently
# published tag can be maintenance on 1.x rather than the newest version.
# Check against npm's dist-tags: npm view n8n dist-tags

services:
  n8n:
    image: n8nio/n8n:2.44.6
    container_name: n8n-portfolio
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    volumes:
      # Persistence: credentials, workflows and n8n's local database.
      - n8n_data:/home/node/.n8n
      # Cases mounted read-only, so JSONs can be imported from inside.
      - ./cases:/cases:ro

volumes:
  n8n_data:
